# Server Block 1: Beta App trên Port 8080
server {
    listen 8080;
    server_name _;

    root /var/www/beta-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Server Block 2: Internal App trên Port 8090
server {
    listen 8090;
    server_name _;

    root /var/www/internal-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}
